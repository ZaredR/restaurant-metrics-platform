<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avisos — RestaurantOS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
<div class="app-layout">
  <div id="sidebar-placeholder"></div>
  <div class="main-content">
    <div class="topbar">
      <div>
        <div class="topbar-title">Avisos</div>
        <div class="topbar-subtitle">Comunicaciones y notificaciones del sistema</div>
      </div>
      <div class="topbar-actions" id="topbar-actions"></div>
    </div>
    <div class="page-body">
      <!-- Stats -->
      <div class="stats-grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:18px">
        <div class="stat-card"><div class="stat-label">Total avisos</div><div class="stat-value" id="s-total">—</div></div>
        <div class="stat-card"><div class="stat-label">No leídos</div><div class="stat-value text-brand" id="s-unread">—</div></div>
        <div class="stat-card"><div class="stat-label">Alta prioridad</div><div class="stat-value text-danger" id="s-alta">—</div></div>
      </div>

      <div class="tabs">
        <div class="tab active" onclick="filterAvisos('all', this)">Todos</div>
        <div class="tab" onclick="filterAvisos('unread', this)">No leídos <span id="unread-badge" class="nav-badge" style="background:var(--brand);color:#fff;font-size:10px;padding:1px 6px;border-radius:20px;margin-left:4px"></span></div>
        <div class="tab" onclick="filterAvisos('alta', this)">Alta prioridad</div>
      </div>

      <div id="avisos-list">
        <div class="loading-overlay"><div class="spinner"></div> Cargando...</div>
      </div>
    </div>
  </div>
</div>

<!-- Modal publicar aviso -->
<div class="modal-overlay" id="modal-aviso">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">Publicar aviso</div>
      <div class="modal-close" onclick="hideModal('modal-aviso')">✕</div>
    </div>
    <div class="form-group">
      <label class="form-label">Título</label>
      <input class="form-input" id="a-title" placeholder="Nuevo concurso de febrero">
    </div>
    <div class="form-group">
      <label class="form-label">Contenido</label>
      <textarea class="form-textarea" id="a-content" placeholder="Descripción del aviso..."></textarea>
    </div>
    <div class="form-grid">
      <div class="form-group">
        <label class="form-label">Prioridad</label>
        <select class="form-select" id="a-priority">
          <option value="baja">Baja</option>
          <option value="media">Media</option>
          <option value="alta">Alta</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Dirigido a</label>
        <select class="form-select" id="a-role">
          <option value="">Todos</option>
          <option value="mesero">Meseros</option>
          <option value="supervisor">Supervisores</option>
          <option value="gerente">Gerentes</option>
        </select>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="hideModal('modal-aviso')">Cancelar</button>
      <button class="btn btn-primary" onclick="publishAviso()">Publicar aviso</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/layout.js"></script>
<script>
let allAvisos = []
let readIds = new Set()
let currentFilter = 'all'

async function init() {
  await renderLayout('avisos.html')
  const user = Auth.getUser()

  if (Auth.can(user, 'notices')) {
    document.getElementById('topbar-actions').innerHTML = `
      <button class="btn btn-ghost btn-sm" onclick="markAllRead()">Marcar todos como leídos</button>
      <button class="btn btn-primary" onclick="showModal('modal-aviso')">+ Publicar aviso</button>`
  }

  await loadAvisos()
}

async function loadAvisos() {
  const user = Auth.getUser()
  const restaurantId = getActiveRestaurant()
  if (!restaurantId) return

  allAvisos = await DB.getNotices(restaurantId)

  // Cargar leídos
  const { data: reads } = await db.from('notice_reads').select('notice_id').eq('user_id', user.id)
  readIds = new Set((reads || []).map(r => r.notice_id))

  renderStats()
  renderAvisos(currentFilter)
}

function renderStats() {
  const unread = allAvisos.filter(a => !readIds.has(a.id)).length
  const alta   = allAvisos.filter(a => a.priority === 'alta').length

  document.getElementById('s-total').textContent  = allAvisos.length
  document.getElementById('s-unread').textContent = unread
  document.getElementById('s-alta').textContent   = alta

  const badge = document.getElementById('unread-badge')
  badge.textContent = unread > 0 ? unread : ''
  badge.style.display = unread > 0 ? 'inline' : 'none'
}

function filterAvisos(filter, el) {
  currentFilter = filter
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'))
  el.classList.add('active')
  renderAvisos(filter)
}

function renderAvisos(filter) {
  let list = [...allAvisos]
  if (filter === 'unread') list = list.filter(a => !readIds.has(a.id))
  if (filter === 'alta')   list = list.filter(a => a.priority === 'alta')

  if (list.length === 0) {
    document.getElementById('avisos-list').innerHTML =
      '<div class="empty-state"><div class="empty-state-icon">🔔</div><div class="empty-state-title">Sin avisos</div><div class="empty-state-text">No hay avisos en esta categoría.</div></div>'
    return
  }

  const priorityIcons = { alta: '🔴', media: '🟡', baja: '🔵' }

  document.getElementById('avisos-list').innerHTML = list.map(a => {
    const isUnread = !readIds.has(a.id)
    return `
      <div class="notice-item ${isUnread ? 'unread' : ''}" id="notice-${a.id}">
        <div class="notice-header">
          <div style="font-size:18px">${priorityIcons[a.priority] || '🔵'}</div>
          <div class="notice-title">${a.title}</div>
          <span class="badge badge-${a.priority}">${a.priority.charAt(0).toUpperCase() + a.priority.slice(1)}</span>
          ${a.target_role ? `<span class="badge" style="background:var(--surface2);color:var(--text-secondary)">${a.target_role}</span>` : ''}
        </div>
        ${a.content ? `<div style="font-size:13.5px;color:var(--text-secondary);line-height:1.6">${a.content}</div>` : ''}
        <div class="notice-meta" style="display:flex;align-items:center;justify-content:space-between;margin-top:10px">
          <span>${new Date(a.created_at).toLocaleDateString('es-MX', { day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' })}
            ${a.users ? ` · ${a.users.name}` : ''}
          </span>
          ${isUnread
            ? `<button class="btn btn-ghost btn-sm" onclick="markRead('${a.id}')">Marcar como leído</button>`
            : `<span style="font-size:12px;color:var(--text-tertiary)">✓ Leído</span>`}
        </div>
      </div>`
  }).join('')
}

async function markRead(noticeId) {
  const user = Auth.getUser()
  await DB.markNoticeRead(noticeId, user.id)
  readIds.add(noticeId)
  renderStats()
  renderAvisos(currentFilter)
}

async function markAllRead() {
  const user = Auth.getUser()
  const unread = allAvisos.filter(a => !readIds.has(a.id))
  await Promise.all(unread.map(a => DB.markNoticeRead(a.id, user.id)))
  unread.forEach(a => readIds.add(a.id))
  renderStats()
  renderAvisos(currentFilter)
  toast('Todos los avisos marcados como leídos')
}

async function publishAviso() {
  const user = Auth.getUser()
  const restaurantId = getActiveRestaurant()
  const title    = document.getElementById('a-title').value.trim()
  const content  = document.getElementById('a-content').value.trim()
  const priority = document.getElementById('a-priority').value
  const role     = document.getElementById('a-role').value || null

  if (!title) { toast('El título es requerido', 'error'); return }

  const { error } = await DB.createNotice({
    restaurant_id: restaurantId,
    title, content, priority,
    target_role: role,
    created_by: user.id
  })

  if (error) { toast('Error al publicar aviso', 'error'); return }

  hideModal('modal-aviso')
  document.getElementById('a-title').value = ''
  document.getElementById('a-content').value = ''
  toast('Aviso publicado correctamente')
  await loadAvisos()
}

init()
</script>
</body>
</html>
